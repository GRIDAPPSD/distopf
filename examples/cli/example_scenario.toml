# Minimal user-authored DistOPF scenario.
# Paths are resolved relative to this file.

[case]
path = "../../src/distopf/cases/csv/ieee13"

[analysis]
type = "opf"
objective = "loss"

# Optional: save results and the generated run_config.json here.
[output]
directory = "../../scratch/example_results"

